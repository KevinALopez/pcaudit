<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Audit Report</title>
<style>
:root {
  --bg: #f6f6f8; --panel: #ffffff; --text: #1c1c21; --muted: #676774; --line: #e3e3ea; --hover: #f0f0f5;
  --accent: #3b5bdb; --chip: #ececf2;
  --v0: #d9480f; --v1: #2b8a3e; --v2: #1c7ed6; --v3: #a5acb3; --v4: #e8a100;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131316; --panel: #1c1c21; --text: #ececf1; --muted: #9b9ba8; --line: #2d2d35; --hover: #25252c;
    --accent: #8ea2ff; --chip: #2a2a32;
    --v0: #ff7a45; --v1: #51cf66; --v2: #4dabf7; --v3: #6f777e; --v4: #ffc53d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131316; --panel: #1c1c21; --text: #ececf1; --muted: #9b9ba8; --line: #2d2d35; --hover: #25252c;
  --accent: #8ea2ff; --chip: #2a2a32;
  --v0: #ff7a45; --v1: #51cf66; --v2: #4dabf7; --v3: #6f777e; --v4: #ffc53d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 24px 0; max-width: 1200px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; margin: 0 0 12px; }
.meta { color: var(--muted); font-size: 13px; }
nav { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 100px; }
section { display: none; }
section.on { display: block; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid; border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.card:hover { background: var(--hover); }
.card .k { font-size: 13px; color: var(--muted); }
.card .v { font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.card .s { font-size: 12px; color: var(--muted); }
.lead { font-size: 15px; margin: 0 0 12px; }
.bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--chip); min-width: 40px; }
.bar.big { height: 18px; border-radius: 6px; }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--hover); }
td.barc { width: 28%; min-width: 120px; }
.path { word-break: break-all; }
.dim { color: var(--muted); }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); color: var(--muted); margin-left: 6px; white-space: nowrap; }
.vt { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; color: #fff; white-space: nowrap; font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar input, .toolbar select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); }
.toolbar input[type=search] { flex: 1; min-width: 180px; }
.chip { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.chip.on { color: var(--text); border-color: currentColor; font-weight: 600; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 12px; font-size: 14px; }
.crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; color: var(--muted); }
button.lnk { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; padding: 2px 8px; }
button.lnk:hover { color: var(--text); }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
dl.verdicts dt { font-weight: 600; margin-top: 10px; }
dl.verdicts dd { margin: 2px 0 0 18px; color: var(--muted); }
.theme { float: right; }
ul.alerts { margin: 14px 0 0; padding-left: 18px; }
ul.alerts li { margin: 4px 0; }
ul.alerts a { color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.dupe { padding: 10px 0; border-bottom: 1px solid var(--line); }
.dupe:last-of-type { border-bottom: 0; }
.dupe ul { margin: 6px 0 0; padding-left: 18px; }
.dupe li { margin: 2px 0; }
.dupe a { cursor: pointer; text-decoration: none; }
td.cb, th.cb { width: 28px; padding-right: 0; }
input.sel { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); vertical-align: middle; }
#selbar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-width: calc(100% - 32px); flex-wrap: wrap; }
#selbar[hidden] { display: none; }
button.primary { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 7px 14px; background: var(--accent); color: #fff; cursor: pointer; }
button.primary:hover { filter: brightness(1.08); }
.field { display: flex; flex-direction: column; gap: 4px; margin: 10px 0; }
.field input[type=text] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); max-width: 420px; }
.steps { margin: 8px 0 0; padding-left: 20px; }
.steps li { margin: 4px 0; }
tr.covered td { opacity: .5; }
.panel.danger { border-color: var(--v0); border-width: 2px; }
.panel.danger h2 { color: var(--v0); }
code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
@media (max-width: 640px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  td.barc { display: none; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <button class="lnk theme" id="theme" title="Switch light or dark">Theme</button>
  <h1>PC Audit Report</h1>
  <div class="meta" id="meta"></div>
  <nav id="tabs">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="folders">Folders</button>
    <button data-tab="files">Files</button>
    <button data-tab="repos">Git repos</button>
    <button data-tab="dupes">Duplicates</button>
    <button data-tab="programs">Programs</button>
    <button data-tab="backup">Backup script <span id="selcount" class="tag" hidden></span></button>
    <button data-tab="problems">Problems</button>
    <button data-tab="about">How to read this</button>
  </nav>
</header>
<main>
  <section id="overview" class="on"></section>
  <section id="folders"></section>
  <section id="files"></section>
  <section id="repos"></section>
  <section id="dupes"></section>
  <section id="programs"></section>
  <section id="backup"></section>
  <section id="problems"></section>
  <section id="about"></section>
</main>
<div id="selbar" hidden></div>
<script id="data" type="application/json">__PCAUDIT_DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const NV = D.verdicts.length;
const VDESC = [
  "Exists only on this PC. Copy it somewhere before you wipe.",
  "Already exists somewhere else, such as OneDrive or another sync client.",
  "Can be downloaded or installed again: Windows, programs, dependencies, games.",
  "Caches, temp files and leftovers. Fine to lose.",
  "The tool couldn't decide. Have a quick look.",
];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sum = a => a.reduce((x, y) => x + y, 0);
const vc = v => `var(--v${v})`;
function size(b) {
  if (b < 1024) return b + " B";
  const u = "KMGTPE"; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + " " + u[i] + "B";
}
const num = n => n.toLocaleString();
const day = t => t > 0 ? new Date(t * 1000).toISOString().slice(0, 10) : "";
const vtag = v => `<span class="vt" style="background:${vc(v)}">${esc(D.verdicts[v])}</span>`;
function bar(sizes, max, big) {
  const total = max || sum(sizes) || 1;
  return `<div class="bar${big ? " big" : ""}">` + sizes.map((s, v) => s > 0 ? `<span style="width:${(s / total * 100).toFixed(3)}%;background:${vc(v)}" title="${esc(D.verdicts[v])}: ${size(s)}"></span>` : "").join("") + "</div>";
}
const legend = () => `<div class="legend">${D.verdicts.map((n, v) => `<span><span class="dot" style="background:${vc(v)}"></span>${esc(n)}</span>`).join("")}</div>`;

// ---------- data ----------
const nodes = D.nodes.map((n, i) => ({ i, parent: n[0], name: n[1], count: n[2], sizes: n[3], own: n[4], ownCount: n[5], reason: n[6], err: n[7], kids: [], files: [] }));
for (const n of nodes) { n.size = sum(n.sizes); if (n.parent >= 0) nodes[n.parent].kids.push(n.i); }
const files = D.files.map((f, i) => ({ i, node: f[0], name: f[1], size: f[2], mtime: f[3], cat: f[4], v: f[5], reason: f[6], flags: f[7] }));
for (const f of files) if (f.node >= 0) nodes[f.node].files.push(f);
const roots = nodes.filter(n => n.parent < 0);
const totals = Array(NV).fill(0), counts = Array(NV).fill(0);
for (const r of roots) r.sizes.forEach((s, v) => totals[v] += s);
for (const c of D.catCounts) c.forEach((n, v) => counts[v] += n);
const grand = sum(totals);
const sep = (roots[0] && roots[0].name.includes("\\")) ? "\\" : "/";
const pathMemo = new Map();
function pathOf(i) {
  if (i < 0) return "";
  if (pathMemo.has(i)) return pathMemo.get(i);
  const n = nodes[i];
  let p = n.parent < 0 ? n.name : pathOf(n.parent);
  if (n.parent >= 0) p = (p.endsWith(sep) ? p : p + sep) + n.name;
  pathMemo.set(i, p);
  return p;
}
const reasonText = r => r >= 0 ? D.reasons[r] : "";
const FLAGS = [[1, "online-only"], [2, "hidden"], [4, "system"], [8, "link"], [16, "synced"], [32, "sparse: size shown is real disk use"], [64, "duplicate"]];

// ---------- repos and duplicates (shared helpers) ----------
const repos = (D.repos || []).map(r => ({ node: r[0], remote: r[1], branch: r[2], changed: r[3], untracked: r[4], headUnpushed: r[5], allUnpushed: r[6], stashes: r[7], err: r[8], sizes: r[9] }));
function repoState(r) {
  if (r.err) return { v: 4, text: "Couldn't check: " + r.err };
  const issues = [];
  if (!r.remote) issues.push("no remote, so every commit exists only here");
  if (r.allUnpushed) issues.push(`${num(r.allUnpushed)} unpushed commit${r.allUnpushed > 1 ? "s" : ""}`);
  if (r.changed) issues.push(`${num(r.changed)} changed file${r.changed > 1 ? "s" : ""}`);
  if (r.untracked) issues.push(`${num(r.untracked)} new file${r.untracked > 1 ? "s" : ""}`);
  if (r.stashes) issues.push(`${num(r.stashes)} stash${r.stashes > 1 ? "es" : ""}`);
  return issues.length ? { v: 0, text: issues.join(", ") } : { v: 1, text: "Clean and pushed" };
}
const reposAtRisk = repos.filter(r => repoState(r).v !== 1);
const dupes = (D.dupes || []).map(d => ({ size: d[0], files: d[1].map(([node, name]) => ({ node, name })) }));
const dupeWasted = dupes.reduce((s, d) => s + d.size * (d.files.length - 1), 0);

// Folder pairs that hold identical files. A pair of matching sub-folders is
// lifted to its parents while the folder names match, so two copies of an
// extracted archive show up as one pair at the top of each copy.
function isUnder(a, b) { for (let i = a; i >= 0; i = nodes[i].parent) if (i === b) return true; return false; }
function liftPair(a, b) {
  const same = (x, y) => nodes[x].name.toLowerCase() === nodes[y].name.toLowerCase();
  for (;;) {
    const pa = nodes[a].parent, pb = nodes[b].parent;
    // Step up only while both folders and both parents have matching names.
    if (pa < 0 || pb < 0 || !same(a, b) || !same(pa, pb)) return [a, b];
    if (pa === pb || isUnder(pa, pb) || isUnder(pb, pa)) return [a, b];
    a = pa; b = pb;
  }
}
const dupePairs = (() => {
  const pairs = new Map();
  for (const d of dupes) {
    const dirs = [...new Set(d.files.map(f => f.node))].filter(n => n >= 0).sort((x, y) => x - y);
    for (let i = 0; i < dirs.length; i++) for (let j = i + 1; j < dirs.length; j++) {
      const [a, b] = liftPair(dirs[i], dirs[j]);
      const k = a < b ? a + "," + b : b + "," + a;
      const p = pairs.get(k) || { a: Math.min(a, b), b: Math.max(a, b), bytes: 0, files: 0 };
      p.bytes += d.size; p.files++;
      pairs.set(k, p);
    }
  }
  return [...pairs.values()].sort((x, y) => y.bytes - x.bytes);
})();

// ---------- selection for the backup script ----------
// Keys are "d:<folder index>" or "f:<file index>". The selection is kept in
// this browser for this report only, so a reload doesn't lose it.
const selStore = `pcaudit-sel-${D.meta.host}-${D.meta.started}`;
const sel = new Set();
try { for (const k of JSON.parse(localStorage.getItem(selStore) || "[]")) sel.add(k); } catch {}
const selBox = key => `<input type="checkbox" class="sel" data-key="${key}"${sel.has(key) ? " checked" : ""} title="Include in the backup script">`;
function selItem(key) {
  const [kind, id] = [key[0], +key.slice(2)];
  if (kind === "d" && nodes[id]) return { key, kind, node: id, path: pathOf(id), size: nodes[id].size, count: nodes[id].count };
  if (kind === "f" && files[id]) { const f = files[id]; return { key, kind, node: f.node, file: f, path: pathOf(f.node) + sep + f.name, size: f.size, count: 1 }; }
  return null;
}
// selItems marks entries already inside another selected folder as covered.
function selItems() {
  const items = [...sel].map(selItem).filter(Boolean);
  const dirs = items.filter(x => x.kind === "d");
  for (const x of items)
    x.covered = x.kind === "d" ? dirs.some(d => d.node !== x.node && isUnder(x.node, d.node)) : dirs.some(d => isUnder(x.node, d.node));
  return items.sort((a, b) => a.path.localeCompare(b.path));
}
function selChanged() {
  try { localStorage.setItem(selStore, JSON.stringify([...sel])); } catch {}
  for (const c of document.querySelectorAll("input.sel")) c.checked = sel.has(c.dataset.key);
  const items = selItems().filter(x => !x.covered);
  const total = sum(items.map(x => x.size));
  const bar = $("#selbar"), count = $("#selcount");
  bar.hidden = items.length === 0;
  count.hidden = items.length === 0;
  count.textContent = items.length;
  const nd = items.filter(x => x.kind === "d").length, nf = items.length - nd;
  bar.innerHTML = `<span><b>${[nd && `${num(nd)} folder${nd > 1 ? "s" : ""}`, nf && `${num(nf)} file${nf > 1 ? "s" : ""}`].filter(Boolean).join(", ")}</b> selected · up to ${size(total)}</span>
    <button class="primary" data-goto-backup>Make backup script</button><button class="lnk" data-clear>Clear</button>`;
  if ($("#backup").classList.contains("on")) renderBackup();
}
document.addEventListener("change", e => {
  const c = e.target.closest("input.sel");
  if (!c) return;
  c.checked ? sel.add(c.dataset.key) : sel.delete(c.dataset.key);
  selChanged();
});
$("#selbar").addEventListener("click", e => {
  if (e.target.closest("[data-goto-backup]")) { renderBackup(); show("backup"); }
  if (e.target.closest("[data-clear]")) { sel.clear(); selChanged(); }
});

// ---------- backup script (.cmd using robocopy, built into Windows) ----------
const SKIP_DIRS = ["node_modules", ".venv", "venv", "__pycache__", ".cache", "Cache", "Code Cache", "GPUCache", ".next", ".gradle", "$RECYCLE.BIN", "System Volume Information"];
const cmdQuote = p => '"' + p.replace(/%/g, "%%") + '"';            // inside quotes only % is special
const cmdEcho = s => s.replace(/\^/g, "^^").replace(/([&|<>])/g, "^$1").replace(/%/g, "%%");
const srcArg = p => cmdQuote(p.endsWith("\\") ? p + "." : p);       // "C:\" would escape the quote
const mirror = p => p.replace(/^([A-Za-z]):\\?/, "$1\\").replace(/\\+$/, "");
const destArg = p => '"%DEST%\\' + mirror(p).replace(/%/g, "%%") + '"';

function buildScript(items, dest, skipDeps) {
  const L = [];
  const live = items.filter(x => !x.covered);
  const dirs = live.filter(x => x.kind === "d");
  const fileGroups = new Map();
  for (const x of live.filter(x => x.kind === "f")) {
    const dir = pathOf(x.node);
    if (!fileGroups.has(dir)) fileGroups.set(dir, []);
    fileGroups.get(dir).push(x.file.name);
  }
  const steps = dirs.length + fileGroups.size;
  const common = "/COPY:DAT /DCOPY:T /R:1 /W:1 /XJ /NP /NDL /TEE /LOG+:\"%LOG%\"";
  const xd = skipDeps ? " /XD " + SKIP_DIRS.map(cmdQuote).join(" ") : "";
  L.push("@echo off", "chcp 65001 >nul", "setlocal",
    `rem Backup script made by pcaudit ${m.version} for ${m.host} on ${new Date().toISOString().slice(0, 10)}.`,
    "rem It only COPIES with robocopy. Nothing on this PC is changed or deleted.",
    "rem Running it again resumes: files that were already copied are skipped.",
    "rem Change DEST to copy somewhere else.",
    `set "DEST=${dest.replace(/%/g, "%%").replace(/"/g, "")}"`,
    "",
    `echo This copies ${steps} item${steps === 1 ? "" : "s"} (up to ${cmdEcho(size(sum(live.map(x => x.size))))}) to:`,
    "echo   %DEST%",
    "echo The folder structure is kept, so C:\\Users\\you\\Documents ends up in %DEST%\\C\\Users\\you\\Documents.",
    "echo.",
    "echo Press any key to start, or close this window to cancel.",
    "pause >nul",
    'if not exist "%DEST%" mkdir "%DEST%"',
    'if not exist "%DEST%" (echo Can not create the destination folder. & pause & exit /b 1)',
    'set "LOG=%DEST%\\pcaudit-backup.log"',
    "set FAILED=0", "");
  let n = 0;
  for (const d of dirs) {
    n++;
    L.push(`echo [${n}/${steps}] ${cmdEcho(d.path)}`,
      `robocopy ${srcArg(d.path)} ${destArg(d.path)} /E ${common}${xd}`,
      "if errorlevel 8 set FAILED=1", "");
  }
  for (const [dir, names] of fileGroups) {
    n++;
    // Keep each line well under cmd's 8191-character limit.
    const chunks = [[]];
    let len = 0;
    for (const name of names) {
      if (len > 6000) { chunks.push([]); len = 0; }
      chunks[chunks.length - 1].push(name);
      len += name.length + 3;
    }
    L.push(`echo [${n}/${steps}] ${cmdEcho(dir)} (${names.length} file${names.length > 1 ? "s" : ""})`);
    for (const c of chunks)
      L.push(`robocopy ${srcArg(dir)} ${destArg(dir)} ${c.map(cmdQuote).join(" ")} ${common}`, "if errorlevel 8 set FAILED=1");
    L.push("");
  }
  L.push("echo.", 'if "%FAILED%"=="1" goto failed',
    "echo Done. Everything was copied to %DEST%", "goto end",
    ":failed", "echo Some files could not be copied. The log lists them: %LOG%",
    ":end", "echo.", "pause");
  return L.join("\r\n") + "\r\n";
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "application/octet-stream" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

let backupDest = "E:\\pcaudit-backup", backupSkip = true;
try { backupDest = localStorage.getItem("pcaudit-dest") || backupDest; } catch {}
function renderBackup() {
  const items = selItems();
  const live = items.filter(x => !x.covered);
  const box = $("#backup");
  const windows = (m.os || "").startsWith("windows");
  const rows = items.map(x => `<tr class="${x.covered ? "covered" : ""}">
      <td class="cb">${selBox(x.key)}</td>
      <td class="path">${x.kind === "d" ? "📁" : "📄"} ${esc(x.path)}${x.covered ? `<span class="tag">already inside a selected folder</span>` : ""}</td>
      <td class="n">${size(x.size)}</td><td class="n hide-sm">${num(x.count)}</td></tr>`).join("");
  box.innerHTML = `

// ---------- folders ----------
const ff = { node: -1, v: -1 };
function openFolder(i) { ff.node = i; renderFolders(); show("folders"); }
function renderFolders() {
  const cur = ff.node >= 0 ? nodes[ff.node] : null;
  const pick = s => ff.v < 0 ? sum(s) : s[ff.v];
  const kids = (cur ? cur.kids.map(k => nodes[k]) : roots).filter(n => pick(n.sizes) > 0 || ff.v < 0).sort((a, b) => pick(b.sizes) - pick(a.sizes));
  const max = Math.max(1, ...kids.map(n => pick(n.sizes)));
  const barFor = s => ff.v < 0 ? bar(s, max) : bar(s.map((x, v) => v === ff.v ? x : 0), max);

  let crumbs = `<a data-node="-1">This PC</a>`;
  if (cur) {
    const chain = []; for (let i = cur.i; i >= 0; i = nodes[i].parent) chain.unshift(i);
    crumbs += chain.map(i => ` <span class="dim">›</span> <a data-node="${i}">${esc(nodes[i].name)}</a>`).join("");
  }
  const rows = kids.map(n => `<tr class="click" data-node="${n.i}">
      <td class="cb">${selBox("d:" + n.i)}</td>
      <td>📁 ${esc(n.name)}${n.reason >= 0 && (!cur || n.reason !== cur.reason) ? `<span class="tag">${esc(D.reasons[n.reason])}</span>` : ""}${n.err ? `<span class="tag">partly unreadable</span>` : ""}</td>
      <td class="barc">${barFor(n.sizes)}</td>
      <td class="n">${size(pick(n.sizes))}</td><td class="n">${num(n.count)}</td></tr>`);

  if (cur) {
    const own = pick(cur.own);
    if (own > 0 || (ff.v < 0 && cur.ownCount > 0))
      rows.push(`<tr><td class="cb"></td><td class="dim">📄 Files directly in this folder</td><td class="barc">${barFor(cur.own)}</td><td class="n">${size(own)}</td><td class="n">${num(cur.ownCount)}</td></tr>`);
    const rest = cur.sizes.map((s, v) => s - cur.own[v] - sum(cur.kids.map(k => nodes[k].sizes[v])));
    if (pick(rest) > 0)
      rows.push(`<tr><td class="cb"></td><td class="dim">Smaller folders, not listed one by one</td><td class="barc">${barFor(rest)}</td><td class="n">${size(pick(rest))}</td><td></td></tr>`);
  }

  let fileHtml = "";
  if (cur) {
    const fl = cur.files.filter(f => ff.v < 0 || f.v === ff.v).slice().sort((a, b) => b.size - a.size);
    const shown = fl.slice(0, 300);
    const missing = cur.ownCount - cur.files.length;
    fileHtml = `<div class="panel"><h2>Files in this folder</h2>${shown.length ? `<div class="tw"><table>
      <thead><tr><th class="cb"></th><th>Name</th><th class="n">Size</th><th class="n hide-sm">Modified</th><th>Type</th><th>Verdict</th></tr></thead><tbody>
      ${shown.map(f => `<tr><td class="cb">${selBox("f:" + f.i)}</td><td class="path">${esc(f.name)}${flagTags(f.flags)}</td><td class="n">${size(f.size)}</td><td class="n hide-sm">${day(f.mtime)}</td>
        <td class="dim">${esc(D.categories[f.cat])}</td><td>${vtag(f.v)} <span class="dim">${esc(D.reasons[f.reason])}</span></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="dim">No individual files listed for this folder.</p>`}
      ${missing > 0 ? `<p class="note">${num(missing)} smaller files here aren't included in this report. files.csv lists every file.</p>` : ""}</div>`;
  }

  $("#folders").innerHTML = `
    <div class="toolbar"><span class="dim">Show sizes for</span>
      <select id="fv"><option value="-1">All verdicts</option>${D.verdicts.map((n, v) => `<option value="${v}"${ff.v === v ? " selected" : ""}>${esc(n)}</option>`).join("")}</select>
      ${cur ? `<button class="lnk" data-copy="${esc(pathOf(cur.i))}">copy path</button> <label class="dim">${selBox("d:" + cur.i)} back up this whole folder</label>` : ""}</div>
    <div class="crumbs">${crumbs}</div>
    <div class="panel"><div class="tw"><table><thead><tr><th class="cb"></th><th>Folder</th><th class="hide-sm"></th><th class="n">Size</th><th class="n">Files</th></tr></thead>
      <tbody>${rows.join("") || `<tr><td colspan="5" class="dim">Nothing here for this verdict.</td></tr>`}</tbody></table></div>${legend()}</div>
    ${fileHtml}`;
  $("#fv").value = ff.v;
}

// ---------- files ----------
const fs = { verdicts: new Set(D.verdicts.map((_, v) => v)), cat: -1, q: "", min: 0, sort: "size", page: 0 };
const PAGE = 100;
let fullPaths = null;
function renderFiles() {
  const box = $("#files");
  if (!box.dataset.built) {
    box.dataset.built = 1;
    box.innerHTML = `
      <div class="toolbar" id="fchips"></div>
      <div class="toolbar">
        <input type="search" id="fq" placeholder="Search name or folder…">
        <select id="fcat"><option value="-1">All types</option>${D.categories.map((n, c) => `<option value="${c}">${esc(n)}</option>`).join("")}</select>
        <select id="fmin"><option value="0">Any size</option><option value="1048576">≥ 1 MB</option><option value="10485760">≥ 10 MB</option><option value="104857600">≥ 100 MB</option><option value="1073741824">≥ 1 GB</option></select>
        <select id="fsort"><option value="size">Largest first</option><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">Name</option></select>
      </div>
      <div class="panel"><div id="fcount" class="dim" style="margin-bottom:8px"></div><div class="tw" id="ftable"></div><div class="pager" id="fpager"></div>
      <p class="note">This report lists the largest ${num(files.length)} of ${num(m.files)} files, the most important ones of each verdict. ${m.csv ? "files.csv next to this report lists every file and opens in Excel." : ""}</p></div>`;
    let t;
    $("#fq").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { fs.q = e.target.value.trim().toLowerCase(); fs.page = 0; renderFiles(); }, 150); });
    $("#fcat").addEventListener("change", e => { fs.cat = +e.target.value; fs.page = 0; renderFiles(); });
    $("#fmin").addEventListener("change", e => { fs.min = +e.target.value; fs.page = 0; renderFiles(); });
    $("#fsort").addEventListener("change", e => { fs.sort = e.target.value; fs.page = 0; renderFiles(); });
    box.addEventListener("click", e => {
      const c = e.target.closest("[data-chip]");
      if (c) {
        const v = +c.dataset.chip;
        if (fs.verdicts.size === NV) fs.verdicts = new Set([v]);
        else if (fs.verdicts.has(v)) { fs.verdicts.delete(v); if (!fs.verdicts.size) fs.verdicts = new Set(D.verdicts.map((_, i) => i)); }
        else fs.verdicts.add(v);
        fs.page = 0; renderFiles(); return;
      }
      const p = e.target.closest("[data-page]");
      if (p) { fs.page += +p.dataset.page; renderFiles(); window.scrollTo(0, 0); return; }
      const fo = e.target.closest("[data-folder]");
      if (fo) openFolder(+fo.dataset.folder);
    });
  }
  $("#fcat").value = fs.cat;
  $("#fchips").innerHTML = `<span class="dim">Verdict</span>` + D.verdicts.map((n, v) =>
    `<button class="chip${fs.verdicts.has(v) && fs.verdicts.size < NV ? " on" : ""}" data-chip="${v}" style="${fs.verdicts.has(v) && fs.verdicts.size < NV ? `color:${vc(v)}` : ""}"><span class="dot" style="background:${vc(v)}"></span>${esc(n)}</button>`).join("");

  if (fs.q && !fullPaths) fullPaths = files.map(f => (pathOf(f.node) + sep + f.name).toLowerCase());
  const idx = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (!fs.verdicts.has(f.v) || (fs.cat >= 0 && f.cat !== fs.cat) || f.size < fs.min) continue;
    if (fs.q && !fullPaths[i].includes(fs.q)) continue;
    idx.push(i);
  }
  const cmp = { size: (a, b) => files[b].size - files[a].size, new: (a, b) => files[b].mtime - files[a].mtime, old: (a, b) => files[a].mtime - files[b].mtime, name: (a, b) => files[a].name.localeCompare(files[b].name) }[fs.sort];
  idx.sort(cmp);
  const pages = Math.max(1, Math.ceil(idx.length / PAGE));
  fs.page = Math.min(Math.max(0, fs.page), pages - 1);
  const slice = idx.slice(fs.page * PAGE, fs.page * PAGE + PAGE);
  const totalSize = idx.reduce((s, i) => s + files[i].size, 0);
  $("#fcount").textContent = `${num(idx.length)} files · ${size(totalSize)}`;
  $("#ftable").innerHTML = `<table><thead><tr><th class="cb"></th><th>Name</th><th class="hide-sm">Folder</th><th class="n">Size</th><th class="n hide-sm">Modified</th><th>Verdict</th></tr></thead><tbody>
    ${slice.map(i => { const f = files[i]; const dir = pathOf(f.node); return `<tr><td class="cb">${selBox("f:" + i)}</td>
      <td class="path">${esc(f.name)}${flagTags(f.flags)}<div class="dim" style="font-size:12px">${esc(D.categories[f.cat])}</div></td>
      <td class="path hide-sm"><a class="dim" style="cursor:pointer" data-folder="${f.node}">${esc(dir)}</a> <button class="lnk" data-copy="${esc(dir + sep + f.name)}">copy</button></td>
      <td class="n">${size(f.size)}</td><td class="n hide-sm">${day(f.mtime)}</td>
      <td>${vtag(f.v)}<div class="dim" style="font-size:12px">${esc(D.reasons[f.reason])}</div></td></tr>`; }).join("")}
    </tbody></table>`;
  $("#fpager").innerHTML = pages > 1 ? `<button class="lnk" data-page="-1" ${fs.page === 0 ? "disabled" : ""}>‹ Prev</button> page ${fs.page + 1} of ${pages} <button class="lnk" data-page="1" ${fs.page >= pages - 1 ? "disabled" : ""}>Next ›</button>` : "";
}

// ---------- git repos ----------
function renderRepos() {
  const box = $("#repos");
  if (!m.gitChecked) {
    box.innerHTML = `<div class="panel"><h2>Git repositories</h2><p class="dim">Repositories weren't checked, either because git isn't installed or because the scan ran with -no-git. Code in them is sorted by file type only.</p></div>`;
    return;
  }
  const rows = repos.map(r => {
    const st = repoState(r), p = pathOf(r.node);
    return `<tr class="click" data-node="${r.node}">
      <td class="path">${esc(p)} <button class="lnk" data-copy="${esc(p)}">copy</button>
        ${r.remote ? `<div class="dim" style="font-size:12px">${esc(r.remote)}</div>` : ""}</td>
      <td class="dim hide-sm">${esc(r.branch || "")}</td>
      <td>${vtag(st.v)}<div class="dim" style="font-size:12px">${esc(st.text)}</div></td>
      <td class="n">${size(sum(r.sizes))}</td></tr>`;
  }).join("");
  box.innerHTML = `<div class="panel"><h2>Git repositories (${num(repos.length)})</h2>
    <p class="note" style="margin:0 0 10px">git was asked about every repository it found. Committed and pushed files count as <b>Already safe</b>. Changed, new or unpushed work counts as <b>Back up</b>, and so does the hidden .git folder of a repo with unpushed commits or stashes. Files git ignores, like node_modules or build output, follow the normal rules.</p>
    ${repos.length ? `<div class="tw"><table><thead><tr><th>Repository</th><th class="hide-sm">Branch</th><th>Status</th><th class="n">Size</th></tr></thead>
    <tbody>${rows}</tbody></table></div>` : `<p class="dim">No git repositories found.</p>`}</div>`;
}
$("#repos").addEventListener("click", e => {
  const row = e.target.closest("tr[data-node]");
  if (row) openFolder(+row.dataset.node);
});

// ---------- duplicates ----------
let dupeLimit = 100;
function renderDupes() {
  const box = $("#dupes");
  if (!m.dupesChecked) {
    box.innerHTML = `<div class="panel"><h2>Duplicates</h2><p class="dim">The duplicate check didn't run. It reads every possible copy in full, so it only runs when you ask for it with <code>pcaudit -dupes</code>, and never on a drive that has logged errors.${m.safetyNote ? " " + esc(m.safetyNote) : ""}</p></div>`;
    return;
  }
  const list = dupes.slice(0, dupeLimit).map(d => `<div class="dupe">
      <div><b>${size(d.size)}</b> × ${d.files.length} copies <span class="dim">· ${size(d.size * (d.files.length - 1))} extra</span></div>
      <ul>${d.files.map(f => { const p = pathOf(f.node) + sep + f.name; return `<li class="path"><a class="dim" data-folder="${f.node}">${esc(pathOf(f.node))}${esc(sep)}</a>${esc(f.name)} <button class="lnk" data-copy="${esc(p)}">copy</button></li>`; }).join("")}</ul>
    </div>`).join("");
  box.innerHTML = `<div class="panel"><h2>Duplicate files</h2>
    <p class="lead">${dupes.length ? `<b>${size(dupeWasted)}</b> is taken by extra copies, in ${num(dupes.length)} sets of identical files.` : "No duplicates found."}</p>
    <p class="note" style="margin:0 0 6px">Files of ${size(m.dupeMinSize)} or more that are marked Back up or Review were compared byte for byte (SHA-256). Online-only files were skipped so nothing gets downloaded. Copies count as duplicates even when their names differ.</p></div>
    ${dupePairs.length ? `<div class="panel"><h2>Folders that are copies of each other</h2>
      <div class="tw"><table><thead><tr><th>Folder</th><th>Has the same files as</th><th class="n">Identical</th><th class="n">Files</th></tr></thead><tbody>
      ${dupePairs.slice(0, 25).map(p => `<tr><td class="path"><a class="dim" data-folder="${p.a}">${esc(pathOf(p.a))}</a></td>
        <td class="path"><a class="dim" data-folder="${p.b}">${esc(pathOf(p.b))}</a></td>
        <td class="n">${size(p.bytes)}</td><td class="n">${num(p.files)}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">Usually the same archive extracted twice, or a folder copied as a backup. Click a folder to open it.</p></div>` : ""}
    ${dupes.length ? `<div class="panel"><h2>Every set of identical files</h2>${list}
      ${dupes.length > dupeLimit ? `<button class="lnk" id="dupemore">Show ${num(Math.min(100, dupes.length - dupeLimit))} more</button>` : ""}</div>` : ""}`;
}
$("#dupes").addEventListener("click", e => {
  if (e.target.id === "dupemore") { dupeLimit += 100; renderDupes(); return; }
  const fo = e.target.closest("[data-folder]");
  if (fo) openFolder(+fo.dataset.folder);
});

// ---------- problems ----------
// ---------- drive health ----------
const health = m.health || null;
const sickDisks = health ? health.disks.filter(d => (d.events && d.events.length) || (d.health && d.health !== "Healthy")) : [];
const diskName = d => `Disk ${d.number} (${esc(d.model)}${d.letters && d.letters.length ? ", " + esc(d.letters.join(" ")) : ""})`;
const when = t => { const d = new Date(t); return isNaN(d) || d.getFullYear() < 2000 ? "" : d.toLocaleString(); };
function healthBanner() {
  if (!sickDisks.length && !m.diskErrors) return "";
  const items = sickDisks.map(d => {
    const n = (d.events || []).reduce((s, e) => s + e.count, 0);
    const latest = (d.events || []).reduce((a, e) => e.latest > a ? e.latest : a, "");
    return `<li><b>${diskName(d)}</b>${d.health && d.health !== "Healthy" ? `: Windows reports its health as <b>${esc(d.health)}</b>` : ""}${n ? `: ${num(n)} disk errors in the last 30 days (${(d.events || []).map(e => `${num(e.count)} × ${esc(e.what)}`).join(", ")}), latest ${esc(when(latest))}` : ""}.</li>`;
  }).join("");
  return `<div class="panel danger"><h2>⚠ A drive has problems</h2>
    <ul class="alerts" style="margin-top:0">${items}${m.diskErrors ? `<li>During this scan the drive failed to read <b>${num(m.diskErrors)}</b> folders or files. <a data-goto="problems">See which ones</a>.</li>` : ""}</ul>
    <p style="margin:10px 0 0">A drive with bad blocks can crash Windows when it's read heavily, and a crash can damage the boot files. <b>Copy what you can't lose to another drive first</b>, and plan to replace this one before you reset or reinstall.</p>
    ${m.safetyNote ? `<p class="note">${esc(m.safetyNote)}</p>` : ""}</div>`;
}

function renderProblems() {
  const errs = D.errors || [];
  const odd = errs.filter(e => e[2] === 0), expected = errs.filter(e => e[2] === 1), diskFailed = errs.filter(e => e[2] === 2);
  const disks = health ? health.disks : [];
  const diskRows = disks.map(d => {
    const n = (d.events || []).reduce((s, e) => s + e.count, 0);
    const bad = n > 0 || (d.health && d.health !== "Healthy");
    return `<tr><td>${diskName(d)}<div class="dim" style="font-size:12px">${esc([d.bus, d.media].filter(Boolean).join(" · "))}</div></td>
      <td>${bad ? `<span class="vt" style="background:${vc(0)}">Problems</span>` : `<span class="vt" style="background:${vc(1)}">No errors logged</span>`}
        <div class="dim" style="font-size:12px">Windows health: ${esc(d.health || "unknown")}</div></td>
      <td class="dim">${(d.events || []).map(e => `${num(e.count)} × ${esc(e.what)}, latest ${esc(when(e.latest))}`).join("<br>") || "None"}</td></tr>`;
  }).join("");
  const table = list => `<div class="tw"><table><thead><tr><th style="width:45%">Path</th><th>Error</th></tr></thead><tbody>
    ${list.map(([p, e]) => `<tr><td class="path">${esc(p)}</td><td class="dim path">${esc(e.replace("open " + p + ": ", ""))}</td></tr>`).join("")}</tbody></table></div>`;
  $("#problems").innerHTML = `
    <div class="panel"><h2>Drives</h2>
      ${disks.length ? `<div class="tw"><table><thead><tr><th>Drive</th><th>Status</th><th>Errors Windows logged in the last 30 days</th></tr></thead><tbody>${diskRows}</tbody></table></div>`
        : `<p class="dim">${health && health.error ? "Couldn't check the drives: " + esc(health.error) : "Drive health isn't checked on this system yet."}</p>`}
      ${health && health.other && health.other.length ? `<p class="note">Not tied to one drive: ${health.other.map(e => `${num(e.count)} × ${esc(e.what)}`).join(", ")}.</p>` : ""}
      <p class="note">Windows often keeps calling a drive "Healthy" while its error log fills up, so pcaudit reads both. This scan used ${num(m.readers || 0)} reader${m.readers === 1 ? "" : "s"} at low priority.</p></div>
    ${diskFailed.length ? `<div class="panel danger"><h2>The drive failed to read these (${num(diskFailed.length)})</h2>
      <p class="note" style="margin:0 0 10px">These are on damaged parts of the drive. Their contents may already be lost or corrupt. If any of them matter, copy them off now, one at a time.</p>
      ${table(diskFailed)}</div>` : ""}
    <div class="panel"><h2>Couldn't read: worth a look (${num(odd.length)})</h2>
      <p class="note" style="margin:0 0 10px">These places couldn't be read and aren't known system folders. Anything inside is missing from the totals. Running pcaudit as administrator usually gets in.</p>
      ${odd.length ? table(odd) : `<p class="dim">Nothing. Every folder outside protected system areas was readable.</p>`}</div>
    <div class="panel"><h2>Couldn't read: protected system folders (${num(expected.length)})</h2>
      <p class="note" style="margin:0 0 10px">Windows keeps these locked, such as the Recycle Bin, System Volume Information and WindowsApps. Your own files don't live here.</p>
      ${expected.length ? `<details><summary class="dim" style="cursor:pointer">Show list</summary>${table(expected)}</details>` : ""}
      ${m.errors > errs.length ? `<p class="note">${num(m.errors)} problems in total. Only the first ${num(errs.length)} are listed.</p>` : ""}</div>
    <div class="panel"><h2>Links not followed (${num(m.links)})</h2>
      <p class="note" style="margin:0">Junctions and symbolic links point somewhere else. They aren't followed, so nothing is counted twice and the scan can't loop.</p></div>`;
}

// ---------- about ----------
function renderAbout() {
  $("#about").innerHTML = `<div class="panel"><h2>What the verdicts mean</h2><dl class="verdicts">
    ${D.verdicts.map((n, v) => `<dt><span class="dot" style="background:${vc(v)}"></span>${esc(n)}</dt><dd>${VDESC[v]}</dd>`).join("")}</dl></div>
    <div class="panel"><h2>How files are sorted</h2>
      <p>First comes the <b>folder</b>. Known places decide a lot: <i>Program Files</i> and <i>Windows</i> are reinstallable, caches and <i>Temp</i> are junk, <i>.ssh</i> and editor settings get backed up, and OneDrive is already safe. Then comes the <b>file type</b>. Inside your own folders, documents, photos and videos get backed up, and installers count as reinstallable.</p>
      <p>A file in a sync folder only counts as <b>Already safe</b> when Windows marks it as managed by the sync client. If a OneDrive file has no sync markers, it's put under Review.</p>
      <p>Inside a <b>git repository</b>, git decides. Committed and pushed files are already safe. Anything changed, new or not pushed needs a backup.</p>
      <p>Your own rules from <span class="path">pcaudit-rules.json</span> are checked before everything else. Run <code>pcaudit -print-rules</code> to see the built-in ones.</p>
      <p class="note">Nothing was changed or uploaded. Apart from comparing possible duplicates, the tool only read folder listings and file details. The report contains your file names, so keep it private.</p></div>`;
}

renderOverview(); renderFolders(); renderFiles(); renderRepos(); renderDupes(); renderPrograms(); renderBackup(); renderProblems(); renderAbout();
selChanged();
</script>
</body>
</html>
