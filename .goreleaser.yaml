version: 2

project_name: pcaudit

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/pcaudit
    binary: pcaudit
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [windows, linux, darwin, android]
    goarch: [amd64, arm64]
    ignore:
      # android/amd64 is emulators only
      - goos: android
        goarch: amd64

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
